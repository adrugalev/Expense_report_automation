[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-report-web-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "python-docx>=1.1,<2",
  "docxtpl>=0.16.8,<1",
  "pillow>=10.3,<13",
  "pdf2image>=1.17,<2",
  "pytesseract>=0.3.13,<1",
  "rapidocr-onnxruntime>=1.4,<2",
  "pdfplumber>=0.11,<1",
  "pypdf>=6,<7",
  "opencv-python-headless>=4.10,<5",
  "pyzbar>=0.1.9,<1",
  "num2words>=0.5.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-cov>=6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
